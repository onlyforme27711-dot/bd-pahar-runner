
name: Build BD PAHAR RUNNER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract game ZIP
        run: |
          mkdir -p project
          unzip -q BD_PAHA_RUNNER_MVP_SOURCE.zip -d project

      - name: Install dependencies
        working-directory: project/bd-pahar-runner
        run: npm install

      - name: Build game
        working-directory: project/bd-pahar-runner
        run: npm run build

      - name: Add Android platform
        working-directory: project/bd-pahar-runner
        run: npx cap add android

      - name: Sync Android
        working-directory: project/bd-pahar-runner
        run: npx cap sync android

      - name: Build APK
        working-directory: project/bd-pahar-runner
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-PAHAR-RUNNER-APK
          path: project/bd-pahar-runner/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
